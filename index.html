<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планировка квартиры</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#242925;font:15px system-ui}header{position:absolute;z-index:2;top:0;left:0;right:0;padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#69716c;font-size:13px}.controls{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #d1d7d0;background:#ffffffed;border-radius:10px;padding:10px 15px;color:#26352d;cursor:pointer;font:inherit}button:hover{background:#e1ede4}canvas{display:block;width:100vw;height:100vh}#viewcube{position:absolute;right:20px;top:100px;width:126px;height:126px;z-index:3;cursor:pointer;touch-action:manipulation}#viewcube canvas{width:100%;height:100%}.hint{position:absolute;bottom:20px;left:28px;background:#ffffffd9;border-radius:10px;padding:10px 14px;color:#5b675e;font-size:12px}.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#66736a}@media(max-width:600px){header{padding:16px;display:block}.controls{margin-top:14px}.hint{left:16px;bottom:16px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><div><h1>Планировка квартиры</h1><p>Интерактивная 3D-модель</p></div><div class="controls"><button id="home">Общий вид</button><button id="top">Вид сверху</button></div></header><div id="viewcube" title="Выберите сторону модели" aria-label="Куб выбора вида"></div><div class="status" id="status">Загружаем модель…</div><div class="hint">Вращение — левой кнопкой · приближение — колёсиком · перемещение — правой кнопкой</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e8e3');
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,10000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x9bada1,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,9,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.screenSpacePanning=true;
let center=new THREE.Vector3(),distance=10,span=10;
function projection(){const aspect=innerWidth/innerHeight;camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.updateProjectionMatrix()}
function view(direction){controls.target.copy(center);camera.up.set(0,1,0);camera.position.copy(center).addScaledVector(direction.clone().normalize(),distance*3);camera.zoom=1;camera.near=distance/1000;camera.far=distance*100;projection();controls.update()}
const directions=[new THREE.Vector3(1,0,0),new THREE.Vector3(-1,0,0),new THREE.Vector3(0,1,0.00001),new THREE.Vector3(0,-1,0.00001),new THREE.Vector3(0,0,1),new THREE.Vector3(0,0,-1)];
document.querySelector('#home').onclick=()=>view(new THREE.Vector3(.8,.8,1));document.querySelector('#top').onclick=()=>view(directions[2]);
const cubeScene=new THREE.Scene(),cubeCamera=new THREE.PerspectiveCamera(35,1,.1,100),cubeRenderer=new THREE.WebGLRenderer({alpha:true,antialias:true});cubeRenderer.setPixelRatio(Math.min(devicePixelRatio,2));cubeRenderer.setSize(126,126);cubeRenderer.outputColorSpace=THREE.SRGBColorSpace;const cubeHost=document.querySelector('#viewcube');cubeHost.appendChild(cubeRenderer.domElement);
function face(label){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#f8faf7';x.fillRect(0,0,256,256);x.strokeStyle='#aebdb1';x.lineWidth=6;x.strokeRect(3,3,250,250);x.fillStyle='#425349';x.font='bold 32px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(label,128,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:t})}
const cube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),['СПРАВА','СЛЕВА','СВЕРХУ','СНИЗУ','СПЕРЕДИ','СЗАДИ'].map(face));cubeScene.add(cube);const raycaster=new THREE.Raycaster();cubeHost.addEventListener('click',e=>{const r=cubeHost.getBoundingClientRect(),pointer=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,cubeCamera);const hit=raycaster.intersectObject(cube)[0];if(hit)view(directions[hit.face.materialIndex])});
new GLTFLoader().load('./model.glb',g=>{scene.add(g.scene);g.scene.traverse(object=>{if(object.isMesh){for(const material of (Array.isArray(object.material)?object.material:[object.material])){material.polygonOffset=true;material.polygonOffsetFactor=1;material.polygonOffsetUnits=1}}const edges=object.userData.cadEdges;if(!Array.isArray(edges)||!edges.length)return;const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(edges,3));const lines=new THREE.LineSegments(geometry,new THREE.LineBasicMaterial({color:0x171c19}));object.add(lines)});const box=new THREE.Box3().setFromObject(g.scene);box.getCenter(center);distance=Math.max(...box.getSize(new THREE.Vector3()).toArray());span=distance*1.75/Math.min(1,innerWidth/innerHeight);view(new THREE.Vector3(.8,.8,1));document.querySelector('#status').remove()},undefined,e=>{document.querySelector('#status').textContent='Не удалось загрузить модель. Проверьте подключение к интернету.';console.error(e)});
addEventListener('resize',()=>{projection();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);cubeCamera.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(4.5);cubeCamera.up.copy(camera.up);cubeCamera.lookAt(0,0,0);cubeRenderer.render(cubeScene,cubeCamera)});
</script></body></html>
