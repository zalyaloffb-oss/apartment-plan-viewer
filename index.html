<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планировка квартиры</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#242925;font:15px system-ui}header{position:absolute;z-index:2;top:0;left:0;right:0;padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#69716c;font-size:13px}.controls{display:flex;gap:8px;pointer-events:auto}button{border:1px solid #d1d7d0;background:#ffffffed;border-radius:10px;padding:10px 15px;color:#26352d;cursor:pointer;font:inherit}button:hover{background:#e1ede4}canvas{display:block;width:100vw;height:100vh}.hint{position:absolute;bottom:20px;left:28px;background:#ffffffd9;border-radius:10px;padding:10px 14px;color:#5b675e;font-size:12px}.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#66736a}@media(max-width:600px){header{padding:16px;display:block}.controls{margin-top:14px}.hint{left:16px;bottom:16px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><div><h1>Планировка квартиры</h1><p>Интерактивная 3D-модель</p></div><div class="controls"><button id="home">Общий вид</button><button id="top">Вид сверху</button></div></header><div class="status" id="status">Загружаем модель…</div><div class="hint">Вращение — левой кнопкой · приближение — колёсиком · перемещение — правой кнопкой</div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e8e3');const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x9bada1,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,9,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let center=new THREE.Vector3(),distance=10;function view(top=false){controls.target.copy(center);camera.position.copy(center).add(top?new THREE.Vector3(0,distance,.001):new THREE.Vector3(distance*.8,distance*.8,distance));camera.near=distance/1000;camera.far=distance*100;camera.updateProjectionMatrix();controls.update()}document.querySelector('#home').onclick=()=>view();document.querySelector('#top').onclick=()=>view(true);new GLTFLoader().load('./model.glb',g=>{scene.add(g.scene);let box=new THREE.Box3().setFromObject(g.scene);box.getCenter(center);distance=Math.max(...box.getSize(new THREE.Vector3()).toArray())*1.65;view();document.querySelector('#status').remove()},undefined,e=>{document.querySelector('#status').textContent='Не удалось загрузить модель. Проверьте подключение к интернету.';console.error(e)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
